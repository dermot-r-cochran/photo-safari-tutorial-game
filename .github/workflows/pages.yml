name: Pages

# Serves index.html from GitHub Pages on every push to main. Nothing is
# installed and nothing is built: the page is the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: The check still passes on what is about to be served
        run: node tools/check.js

      - name: Stage the game
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r images _site/images

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository the first time this runs,
          # with GitHub Actions as its source.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
